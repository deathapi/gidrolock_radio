# GIDROLOCK WSR / WSR.LONG water leak sensors and SENSO 9003 valve remote.
# 867.84 MHz, FSK, 2268 bit/s (440.95 us/bit).
#
# Air frame:
#   AA AA AA AA 2D D4 <class> <id 3B> <B0> <B1> <B2> <sum8>
#
# Class 0x01 - WSR / WSR.LONG water leak sensor:
#   B0: 0x01 = LEAK, 0x04 = OK / keepalive
#   B1 bit0: 1 = low battery
#   B2: 0x20 = WSR, 0x21 = WSR.LONG
#
# Class 0x02, model 0x0B - SENSO 9003 valve remote:
#   B0: 0x00 = BOOT, 0x06 = OPEN, 0x07 = CLOSE
#   B1 bit0: 1 = low battery
#
# sum8 = (id0 + id1 + id2 + B0 + B1 + B2) & 0xFF
# The class byte is not included. The flex DSL exposes the received sum8 but
# cannot validate it.
#
# Usage:
#   rtl_433 -c Gidrolock-WSR.conf

frequency 867.84M

decoder {
    name        = GIDROLOCK-WSR,
    modulation  = FSK_PCM,
    short       = 440.95,
    long        = 440.95,
    reset       = 20000,
    preamble    = 2dd401,
    bits        >= 88,
    get         = id:@0:{24},
    get         = status:@24:{8}:[0x01:LEAK 0x04:OK],
    get         = battery_ok:@39:{1}:[0:1 1:0],
    get         = model:@40:{8}:[0x20:WSR 0x21:WSR.LONG],
    get         = sum8:@48:{8},
}

decoder {
    name        = GIDROLOCK-SENSO-9003,
    modulation  = FSK_PCM,
    short       = 440.95,
    long        = 440.95,
    reset       = 20000,
    preamble    = 2dd402,
    bits        >= 88,
    get         = id:@0:{24},
    get         = command:@24:{8}:[0x00:BOOT 0x06:OPEN 0x07:CLOSE],
    get         = battery_ok:@39:{1}:[0:1 1:0],
    get         = model:@40:{8}:[0x0B:SENSO_9003],
    get         = sum8:@48:{8},
}
